<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient for App Icon Squircle -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d24" />
      <stop offset="50%" stop-color="#070918" />
      <stop offset="100%" stop-color="#04050d" />
    </linearGradient>

    <!-- Main Vibrant Ribbon Gradient (Navy -> Indigo -> Purple -> Cyan) -->
    <linearGradient id="kiranRibbon" x1="15%" y1="85%" x2="90%" y2="15%">
      <stop offset="0%" stop-color="#161556" />
      <stop offset="25%" stop-color="#3b2d9d" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="75%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#00d8f6" />
    </linearGradient>

    <!-- Wing Tip Cyan Boost Gradient -->
    <linearGradient id="wingCyan" x1="30%" y1="70%" x2="100%" y2="10%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="ambientGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Icon Container -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGrad)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="3" />

  <!-- Ambient Light Reflection Behind Logo -->
  <circle cx="280" cy="256" r="140" fill="#7c3aed" opacity="0.16" filter="url(#ambientGlow)" />
  <circle cx="340" cy="190" r="110" fill="#00d8f6" opacity="0.14" filter="url(#ambientGlow)" />

  <!-- Kiran AI Intersecting Ribbon Emblem (K Shape) -->
  <g transform="translate(48, 48) scale(0.8125)">
    <!-- 1. Left Vertical Stem with Subtle Chamfers -->
    <path
      d="M 120,68 
         L 168,68 
         L 168,444 
         L 120,444 
         Z"
      fill="url(#kiranRibbon)"
    />

    <!-- 2. Upper Dynamic Wing (Sweeping from spine up to top-right tip) -->
    <path
      d="M 168,256 
         C 195,215 235,160 295,115 
         C 345,78 395,68 436,68 
         C 436,92 418,126 386,156 
         C 334,204 274,256 220,296 
         L 168,256 Z"
      fill="url(#wingCyan)"
    />

    <!-- 3. Lower Dynamic Wing (Sweeping from spine down to bottom-right tip) -->
    <path
      d="M 168,256 
         C 195,297 235,352 295,397 
         C 345,434 395,444 436,444 
         C 436,420 418,386 386,356 
         C 334,308 274,256 220,216 
         L 168,256 Z"
      fill="url(#kiranRibbon)"
    />

    <!-- 4. Inner Intersecting Diamond Ribbons (Creating the signature woven loop) -->
    <!-- Diagonal Up-Right Ribbon -->
    <path
      d="M 168,365 
         L 330,205 
         C 348,187 362,176 376,168 
         L 344,142 
         C 328,154 310,172 290,192 
         L 168,312 
         Z"
      fill="url(#wingCyan)"
      opacity="0.95"
    />

    <!-- Diagonal Down-Right Ribbon -->
    <path
      d="M 168,147 
         L 330,307 
         C 348,325 362,336 376,344 
         L 344,370 
         C 328,358 310,340 290,320 
         L 168,200 
         Z"
      fill="url(#kiranRibbon)"
    />

    <!-- Central Diamond Core highlight -->
    <path
      d="M 248,256 
         L 282,222 
         L 316,256 
         L 282,290 
         Z"
      fill="url(#wingCyan)"
      opacity="0.9"
    />
  </g>
</svg>
